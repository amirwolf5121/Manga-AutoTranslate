name: Build Android APK

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # برای چسباندن APK به Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.10 (buildPython چاکوپی)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon \
            -PchaquopyBuildPython="$(command -v python)" \
            -Dorg.gradle.jvmargs=-Xmx3g

      - name: Rename APKs (per-ABI + universal)
        run: |
          cd android/app/build/outputs/apk/debug
          for f in app-*-debug.apk app-debug.apk; do
            [ -f "$f" ] || continue
            case "$f" in
              *arm64-v8a*) abi="arm64" ;;
              *armeabi-v7a*) abi="armeabi" ;;
              *x86_64*) abi="x86_64" ;;
              *x86-*) abi="x86" ;;
              *universal*) abi="universal" ;;
              *) abi="all" ;;
            esac
            cp "$f" "manga-translator-${{ github.ref_name }}-$abi.apk"
          done
          cp manga-translator-*.apk "$GITHUB_WORKSPACE/"
          ls -la "$GITHUB_WORKSPACE"/manga-translator-*.apk

      - name: Upload artifact (هر بیلد)
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-apk
          path: manga-translator-*.apk

      - name: Attach to Release (فقط روی release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: manga-translator-*.apk
